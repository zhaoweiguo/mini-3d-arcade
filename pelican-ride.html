    let riding=true,storm=false,soundOn=false,elapsed=0,last=performance.now(),drag=false,px=0,py=0,toastTimer=0,audioCtx=null,oscillators=[];

    function resize(){const r=host.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function pose(a,e=.18){targetAzimuth=a;targetElevation=e}
    document.querySelector('#frontBtn').onclick=()=>{pose(0,.15);notify('正面视角')};document.querySelector('#sideBtn').onclick=()=>{pose(Math.PI/2,.12);notify('侧面视角')};
    const rideBtn=document.querySelector('#rideBtn');rideBtn.onclick=()=>{riding=!riding;document.querySelector('#rideText').textContent=riding?'暂停骑行':'继续骑行';rideBtn.setAttribute('aria-pressed',String(!riding));notify(riding?'出发，沿海岸慢慢骑':'稍作停留')};
    document.querySelector('#weatherBtn').onclick=e=>{storm=!storm;e.currentTarget.setAttribute('aria-pressed',String(storm));document.querySelector('#weatherLabel').textContent=storm?'薄雾 · 18°':'晴天 · 24°';scene.background.set(storm?'#829fa0':'#83c9d0');scene.fog.color.set(storm?'#829fa0':'#83c9d0');sunDisk.material.color.set(storm?'#c4d0bd':'#f6c475');sunLight.intensity=storm?1.5:3;notify(storm?'海雾渐起':'阳光正好')};
    document.querySelector('#soundBtn').onclick=async e=>{soundOn=!soundOn;e.currentTarget.setAttribute('aria-pressed',String(soundOn));if(soundOn){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();const master=audioCtx.createGain();master.gain.value=.014;master.connect(audioCtx.destination);for(let i=0;i<3;i++){const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=[92,137,207][i];gain.gain.value=[.55,.25,.12][i];osc.connect(gain);gain.connect(master);osc.start();oscillators.push(osc)}}catch{soundOn=false;e.currentTarget.setAttribute('aria-pressed','false')}}else{oscillators.forEach(o=>o.stop());oscillators=[];if(audioCtx)audioCtx.close();audioCtx=null}notify(soundOn?'海风环境声已开启':'声音已关闭')};
    host.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;host.setPointerCapture(e.pointerId)});host.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;targetAzimuth-=dx*.007;targetElevation=clamp(targetElevation+dy*.005,-.42,.48)});const endDrag=()=>drag=false;host.addEventListener('pointerup',endDrag);host.addEventListener('pointercancel',endDrag);host.addEventListener('wheel',e=>{e.preventDefault();targetRadius=clamp(targetRadius+e.deltaY*.006,7.2,15)},{passive:false});
    window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();rideBtn.click()}if(e.key==='r'||e.key==='R'){pose(-.43,.18);targetRadius=10.8}if(e.key==='ArrowLeft')targetAzimuth-=.14;if(e.key==='ArrowRight')targetAzimuth+=.14;if(e.key==='ArrowUp')targetElevation=clamp(targetElevation+.08,-.42,.48);if(e.key==='ArrowDown')targetElevation=clamp(targetElevation-.08,-.42,.48)});
    function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(!reduced.matches)elapsed+=dt;const pace=riding&&!reduced.matches?dt*2.4:0;
      targetAzimuth+=(!drag&&riding&&!reduced.matches?dt*.055:0);azimuth+=(targetAzimuth-azimuth)*.045;elevation+=(targetElevation-elevation)*.045;radius+=(targetRadius-radius)*.045;camera.position.set(Math.sin(azimuth)*radius,4.15+Math.sin(elevation)*radius,Math.cos(azimuth)*radius);camera.lookAt(0,1.1,0);
      if(riding){wheelGroup.forEach(w=>w.rotation.z-=pace*1.5);crankPivot.rotation.x+=pace*1.9;bike.position.y=-.82+Math.sin(elapsed*5)*.035;rider.rotation.z=Math.sin(elapsed*2.5)*.018;wingPivot.rotation.z=Math.sin(elapsed*4)*.025;bag.position.y=1.21+Math.sin(elapsed*5)*.035}
      if(!storm)clouds.forEach((c,i)=>{c.position.x+=dt*(.09+i*.022);if(c.position.x>13)c.position.x=-13});else clouds.forEach(c=>c.position.x-=dt*.08);
      legs.forEach((l,i)=>{const ph=elapsed*5+i*Math.PI;const foot=[-.12+Math.cos(ph)*.29,.87+Math.sin(ph)*.23,l.z+.07];const knee=[-.25+Math.cos(ph+.8)*.12,1.18+Math.sin(ph+.8)*.1,l.z];l.foot.position.set(...foot);l.knee.position.set(...knee);setRod(l.thigh,l.hip,knee);setRod(l.shin,knee,foot)});
      renderer.render(scene,camera)}requestAnimationFrame(animate);
  </script>
