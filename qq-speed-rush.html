    scene.add(new THREE.HemisphereLight(0x8ed9dc,0x06121c,1.3));const moon=new THREE.DirectionalLight(0xb7ddff,2.2);moon.position.set(-20,28,16);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);moon.shadow.camera.left=-32;moon.shadow.camera.right=32;moon.shadow.camera.top=32;moon.shadow.camera.bottom=-32;scene.add(moon);const cyanLight=new THREE.PointLight(0x51e8d5,28,24,2);cyanLight.position.set(0,3,0);scene.add(cyanLight);const pinkLight=new THREE.PointLight(0xfb6a84,18,22,2);pinkLight.position.set(8,2,-8);scene.add(pinkLight);

    const trackCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,-24),new THREE.Vector3(16,0,-19),new THREE.Vector3(23,0,-4),new THREE.Vector3(17,0,11),new THREE.Vector3(2,0,20),new THREE.Vector3(-15,0,17),new THREE.Vector3(-24,0,4),new THREE.Vector3(-18,0,-12)],true,'catmullrom',.18);const samples=260;const trackLength=trackCurve.getLength();const safeTrackT=t=>Math.min(.999999,Math.max(0,t));

    ribbon(9,0,M.asphalt);ribbon(9.55,.045,M.edge);ribbon(8.45,.07,M.asphalt);
    for(let i=0;i<samples;i+=10){const t=i/samples,p=trackCurve.getPointAt(t),tan=trackCurve.getTangentAt(t).normalize(),side=new THREE.Vector3(-tan.z,0,tan.x);const dash=new THREE.Mesh(new THREE.BoxGeometry(.16,.035,.95),M.stripe);dash.position.copy(p);dash.position.y=.11;dash.rotation.y=Math.atan2(tan.x,tan.z);scene.add(dash);for(const sign of [-1,1]){const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.5,8),sign===1?M.edgePink:M.edge);lamp.position.copy(p).addScaledVector(side,sign*4.72);lamp.position.y=.25;scene.add(lamp)}}

    for(let i=0;i<40;i++){const a=i*Math.PI*2/40,r=31+(i%5)*2.2;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.8+(i%4)*.34,1),M.rock);rock.position.set(Math.cos(a)*r,-.05,Math.sin(a)*r);rock.scale.y=1.5;rock.castShadow=true;world.add(rock)}
    function addGate(){const g=new THREE.Group();const p=trackCurve.getPointAt(0),tan=trackCurve.getTangentAt(0).normalize(),rot=Math.atan2(tan.x,tan.z);g.position.copy(p);g.rotation.y=rot;for(const x of [-4.2,4.2]){const post=new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,4.2,12),M.yellow);post.position.set(x,2.1,0);post.castShadow=true;g.add(post)}const beam=new THREE.Mesh(new THREE.BoxGeometry(8.7,.33,.28),M.yellow);beam.position.y=4.1;beam.castShadow=true;g.add(beam);for(let i=0;i<7;i++){const light=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),i%2?M.edge:M.edgePink);light.position.set(-3.6+i*1.2,4.1,.2);g.add(light)}scene.add(g)}addGate();

        const wasMoving=race.speed>3;
        race=stepRace(race,input,dt);
        if(input.accelerate&&!started){
          started=true;
          $('#mission').classList.remove('show');
          notify('出发！漂移过弯可积攒能量');
        }
        const distance=race.speed*dt;
        const previousProgress=progress;
        progress=(progress+distance/trackLength)%1;
        if(previousProgress>.8&&progress<.03&&wasMoving){
          lap++;
          if(lap>3){
            lap=3;
            paused=true;
            $('#missionTitle').textContent='FINISH';
            $('#missionSub').textContent='按 R 再来一圈';
            $('#mission').classList.add('show');
            notify('完成三圈！');
          }
        }
        const t=safeTrackT(progress);
        const center=trackCurve.getPointAt(t);
        const tangent=trackCurve.getTangentAt(t).normalize();
        const side=new THREE.Vector3(-tangent.z,0,tangent.x);
        const lane=clamp(race.lateral,-1.3,1.3);
        car.position.copy(center).addScaledVector(side,lane);
        car.position.y=.1;
        const roadYaw=Math.atan2(tangent.x,tangent.z);
        car.rotation.y=roadYaw+race.heading*.13;
        car.rotation.z=clamp(-race.lateral*.12,-.18,.18);
        for(const wheel of car.children){
          if(wheel.geometry?.type==='CylinderGeometry') wheel.rotation.x-=race.speed*dt*1.8;
        }
        flameGroup.children.forEach(flame=>flame.visible=race.boosting);
        if(race.boosting){
          flameGroup.scale.y=.8+Math.sin(elapsed*35)*.18;
          flameGroup.rotation.z=Math.sin(elapsed*18)*.025;
        }
        const mobileCamera=innerWidth<700;
        const followDistance=mobileCamera?11:8;
        const followHeight=mobileCamera?6.1:4.5;
        camera.position.lerp(new THREE.Vector3(car.position.x-tangent.x*followDistance,followHeight,car.position.z-tangent.z*followDistance),.07);
        camera.lookAt(car.position.x+tangent.x*(mobileCamera?4:5),mobileCamera?1.2:1,car.position.z+tangent.z*(mobileCamera?4:5));
        if(engine&&audioOn){
          const oscillator=engine.createOscillator();
          const gain=engine.createGain();
          oscillator.type='sawtooth';
          oscillator.frequency.value=65+race.speed*3.2;
          gain.gain.setValueAtTime(.0001,engine.currentTime);
          gain.gain.exponentialRampToValueAtTime(.18,engine.currentTime+.01);
          gain.gain.exponentialRampToValueAtTime(.0001,engine.currentTime+.08);
          oscillator.connect(gain);gain.connect(engineGain);
          oscillator.start();oscillator.stop(engine.currentTime+.09);
        }
      }
      updateUI();
      renderer.render(scene,camera);
    }
    $('#mission').classList.add('show');
    requestAnimationFrame(animate);
  </script>
</body>
</html>
