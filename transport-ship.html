    let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;shootCooldown=Math.max(0,shootCooldown-dt);if(reload>0){reload-=dt;if(reload<=0){ammo=30;updateHud();tone(360,.08,'sine',.03);note('弹匣已装填')}}if(health>0&&locked){move.set(0,0,0);if(keys.KeyW)move.z-=1;if(keys.KeyS)move.z+=1;if(keys.KeyA)move.x-=1;if(keys.KeyD)move.x+=1;move.x+=touchMove.x;move.z+=touchMove.y;if(move.lengthSq())move.normalize();forward.set(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));camera.position.addScaledVector(forward,-move.z*dt*6);camera.position.addScaledVector(right,move.x*dt*6);camera.position.x=Math.max(-14.2,Math.min(14.2,camera.position.x));camera.position.z=Math.max(-25.5,Math.min(25.5,camera.position.z));camera.rotation.set(pitch,yaw,0)}camera.position.y=1.65;matchTime=Math.max(0,matchTime-dt);$('clock').textContent=String(Math.floor(matchTime/60)).padStart(2,'0')+':'+String(Math.floor(matchTime%60)).padStart(2,'0');enemies.forEach((e,i)=>{if(!e.userData.alive)return;const d=e.position.distanceTo(camera.position);if(d<15&&Math.random()<dt*.07){health=Math.max(0,health-4);tone(125,.04,'square',.018);$('damage').classList.remove('show');void $('damage').offsetWidth;$('damage').classList.add('show');updateHud();if(health===0){start.style.display='grid';enter.textContent='重新部署';note('你已阵亡')}}e.rotation.y=Math.atan2(camera.position.x-e.position.x,camera.position.z-e.position.z)});drawMap();renderer.render(scene,camera)}camera.position.set(0,1.65,19);camera.rotation.y=0;updateHud();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});requestAnimationFrame(frame);
